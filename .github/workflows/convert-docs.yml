name: Convert Word docs to HTML

on:
  push:
    paths:
      - 'content/**'

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Pandoc
        run: sudo apt-get install -y pandoc

      - name: Convert all DOCX files to HTML
        run: |
          find content -name "*.docx" | while read docx_file; do
            html_file="${docx_file/content\//generated/}"
            html_file="${html_file%.docx}.html"
            mkdir -p "$(dirname "$html_file")"
            pandoc "$docx_file" --from docx --to html --no-highlight --wrap=none -o "$html_file"
            echo "Converted: $docx_file -> $html_file"
          done

      - name: Generate manifest and shell pages
        run: python3 scripts/generate.py

      - name: Commit all generated and shell files
        run: |
          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"
          git add generated/ worldbuilding/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-generate pages from content [skip ci]"
            git push
          fi
