# ─────────────────────────────────────────────────────────────
# HOW THIS WORKS:
#   1. You write content in Microsoft Word (.docx)
#   2. Save the file into the content/ folder in your repo
#   3. Commit & push in SourceTree (like any other file)
#   4. This action automatically converts it to HTML in generated/
#   5. Your pages fetch from generated/ and display the content
#
# FOLDER STRUCTURE FOR YOUR WORD DOCS:
#   content/
#     storylines/
#       dnd-campaign-1/
#         index.docx        ← campaign overview
#         chapter-1.docx    ← chapter 1
#         chapter-2.docx    ← chapter 2
#     characters/
#         character-1.docx
#         character-2.docx
#     geography/
#         country-1/
#           index.docx      ← country overview
#           city-1.docx     ← city page
# ─────────────────────────────────────────────────────────────

name: Convert Word docs to HTML

on:
  push:
    paths:
      - 'content/**/*.docx'   # Only runs when a .docx file changes

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # Needed to commit the generated files back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Pandoc
        run: sudo apt-get install -y pandoc

      - name: Convert all DOCX files to HTML
        run: |
          find content -name "*.docx" | while read docx_file; do
            # Mirror the path: content/... → generated/...
            html_file="${docx_file/content\//generated/}"
            html_file="${html_file%.docx}.html"

            # Create the output directory if it doesn't exist
            mkdir -p "$(dirname "$html_file")"

            # Convert: extract just the body content (no full HTML wrapper)
            pandoc "$docx_file" \
              --from docx \
              --to html \
              --no-highlight \
              --wrap=none \
              -o "$html_file"

            echo "Converted: $docx_file → $html_file"
          done

      - name: Commit generated HTML files
        run: |
          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"
          git add generated/
          # Only commit if there are actual changes
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-convert Word docs [skip ci]"
            git push
          fi
