name: Convert Word docs to HTML

on:
  push:
    paths:
      - "content/**"

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Convert DOCX → HTML
        run: |
          set -e
          find content -name "*.docx" | while read docx_file; do
            html_file="${docx_file/content\//generated/}"
            html_file="${html_file%.docx}.html"

            mkdir -p "$(dirname "$html_file")"

            pandoc "$docx_file" \
              --from docx \
              --to html \
              --no-highlight \
              --wrap=none \
              -o "$html_file"

            echo "Converted: $docx_file -> $html_file"
          done

      - name: Generate manifest and shell pages
        run: |
          set -e
          python3 <<'PYEOF'
          import os, json

          # helpers
          def to_title(s):
              return s.replace('-', ' ').replace('_', ' ')

          def read_meta(folder):
              meta = {}
              p = os.path.join(folder, '_meta.txt')

              if os.path.exists(p):
                  with open(p, encoding="utf-8") as f:
                      for line in f:
                          if ':' in line:
                              k, v = line.split(':', 1)
                              meta[k.strip()] = v.strip()

              return meta


          def write_if_missing(path, content):
              if not os.path.exists(path):
                  os.makedirs(os.path.dirname(path), exist_ok=True)

                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)

                  print("Created:", path)


          SHARED_CSS = """
          body { font-family: sans-serif; margin:0; padding:2rem; }
          h1 { font-size:1.8rem; }
          """


          SHARED_HEAD = f"""
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8"/>
              <title>Astatyr</title>
              <style>{SHARED_CSS}</style>
          </head>
          <body>
          """


          SHARED_FOOT = """
          </body>
          </html>
          """


          def make_basic_page(title):
              return SHARED_HEAD + f"<h1>{title}</h1>" + SHARED_FOOT


          manifest = {
              "storylines": [],
              "characters": [],
              "geography": []
          }


          # STORYLINES
          root = "content/storylines"

          if os.path.exists(root):
              for sl in sorted(os.listdir(root)):
                  path = os.path.join(root, sl)

                  if not os.path.isdir(path):
                      continue

                  meta = read_meta(path)

                  chapters = []

                  for f in sorted(os.listdir(path)):
                      if f.endswith(".docx") and f != "index.docx":
                          chapters.append({
                              "id": f[:-5],
                              "title": to_title(f[:-5])
                          })

                  manifest["storylines"].append({
                      "id": sl,
                      "title": meta.get("title", to_title(sl)),
                      "chapters": chapters
                  })


          # CHARACTERS
          root = "content/characters"

          if os.path.exists(root):
              for f in sorted(os.listdir(root)):

                  if not f.endswith(".docx"):
                      continue

                  char_id = f[:-5]

                  manifest["characters"].append({
                      "id": char_id,
                      "title": to_title(char_id)
                  })


          # GEOGRAPHY
          root = "content/geography"

          if os.path.exists(root):
              for g in sorted(os.listdir(root)):

                  path = os.path.join(root, g)

                  if not os.path.isdir(path):
                      continue

                  manifest["geography"].append({
                      "id": g,
                      "title": to_title(g)
                  })


          os.makedirs("generated", exist_ok=True)

          with open("generated/manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)

          print("Manifest written")


          # create shell pages

          for sl in manifest["storylines"]:

              base = f"worldbuilding/storylines/{sl['id']}"

              write_if_missing(
                  f"{base}/index.html",
                  make_basic_page(sl["title"])
              )

              for ch in sl["chapters"]:
                  write_if_missing(
                      f"{base}/{ch['id']}.html",
                      make_basic_page(ch["title"])
                  )


          for ch in manifest["characters"]:
              write_if_missing(
                  f"worldbuilding/characters/{ch['id']}.html",
                  make_basic_page(ch["title"])
              )


          for geo in manifest["geography"]:
              write_if_missing(
                  f"worldbuilding/geography/{geo['id']}/index.html",
                  make_basic_page(geo["title"])
              )


          print("Done.")
          PYEOF


      - name: Commit generated files
        run: |
          set -e

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add generated worldbuilding || true

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Auto-generate pages [skip ci]"
            git push
          fi