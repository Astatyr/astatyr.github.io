          var nextHtml = next ? '<a class="next" href="'+next.id+'.html"><span class="dir">Next &rarr;</span><span class="title">'+next.title+'</span></a>' : '<span></span>';
          document.getElementById('ch-nav').innerHTML = prevHtml + nextHtml;
