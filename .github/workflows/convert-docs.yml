name: Convert Word docs to HTML

on:
  push:
    paths:
      - 'content/**'

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get install -y pandoc optipng jpegoptim

      - name: Convert all DOCX files to HTML (with image extraction)
        run: |
          find content -name "*.docx" | while read docx_file; do
            html_file="${docx_file/content\//generated/}"
            html_file="${html_file%.docx}.html"
            mkdir -p "$(dirname "$html_file")"

            pandoc "$docx_file" \
              --from docx \
              --to html \
              --no-highlight \
              --wrap=none \
              --extract-media="generated/media" \
              -o "$html_file"

            echo "Converted: $docx_file -> $html_file"
          done

      - name: Compress extracted images
        run: |
          if [ -d "generated/media" ]; then
            echo "Compressing PNGs..."
            find generated/media -name "*.png" -exec optipng -quiet -o2 {} \;

            echo "Compressing JPEGs..."
            find generated/media -name "*.jpg" -o -name "*.jpeg" | \
              xargs -r jpegoptim --quiet --max=85

            echo "Image compression done."
          else
            echo "No media folder found, skipping compression."
          fi

      - name: Generate manifest and shell pages
        run: python3 scripts/generate.py

      - name: Commit all generated and shell files
        run: |
          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"
          git add generated/ worldbuilding/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-generate pages from content [skip ci]"
            git push
          fi
