name: Convert Word docs to HTML

on:
  push:
    paths:
      - 'content/**'

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Pandoc
        run: sudo apt-get install -y pandoc

      - name: Convert all DOCX files to HTML
        run: |
          find content -name "*.docx" | while read docx_file; do
            html_file="${docx_file/content\//generated/}"
            html_file="${html_file%.docx}.html"
            mkdir -p "$(dirname "$html_file")"
            pandoc "$docx_file" --from docx --to html --no-highlight --wrap=none -o "$html_file"
            echo "Converted: $docx_file -> $html_file"
          done

      - name: Generate manifest and shell pages
        run: |
          python3 << 'PYEOF'
import os, json, shutil

# ── helpers ──────────────────────────────────────────────
def to_title(s):
    return s.replace('-', ' ').replace('_', ' ')

def read_meta(folder):
    meta = {}
    p = os.path.join(folder, '_meta.txt')
    if os.path.exists(p):
        for line in open(p):
            if ':' in line:
                k, v = line.split(':', 1)
                meta[k.strip()] = v.strip()
    return meta

def write_if_missing(path, content):
    if not os.path.exists(path):
        os.makedirs(os.path.dirname(path), exist_ok=True)
        open(path, 'w').write(content)
        print(f"  Created: {path}")

# ── shared CSS / nav (used across all shell pages) ──────
