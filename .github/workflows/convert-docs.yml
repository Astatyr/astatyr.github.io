          var navHtml = '<a class="nav-btn nav-sub-btn" href="index.html">Overview</a>';
          sl.chapters.forEach(function(c,i){ navHtml += '<a class="nav-btn nav-sub-btn'+(c.id===chId?' active':'')+'" href="'+c.id+'.html">Ch.'+(i+1)+' \u2014 '+c.title+'</a>'; });
