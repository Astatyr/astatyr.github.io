# ── STORYLINE INDEX ──────────────────────────────────────
STORYLINE_INDEX_SCRIPT = """
  <script>
    var parts = window.location.pathname.replace(/\\/$/,'').split('/');
    var slId = parts[parts.length-1];
    async function init() {
      var manifest;
      try { var r = await fetch('/generated/manifest.json'); manifest = await r.json(); } catch(e) { return; }
      var sl = manifest.storylines.find(function(s){ return s.id === slId; });
      if (!sl) { document.getElementById('page-title').textContent = slId.replace(/[-_]/g,' '); return; }
      document.title = sl.title + ' \u2014 Astatyr';
      document.getElementById('page-title').textContent = sl.title;
      document.getElementById('page-meta').textContent = [sl.type, sl.status].filter(Boolean).join(' \u00b7 ');
      document.getElementById('page-desc').textContent = sl.description || '';
      document.getElementById('nav-section-title').textContent = sl.title;
      var navItems = sl.chapters.map(function(ch,i){ return '<a class="nav-btn nav-sub-btn" href="'+ch.id+'.html">Ch.'+(i+1)+' \u2014 '+ch.title+'</a>'; }).join('');
      document.getElementById('nav-items').innerHTML = '<a class="nav-btn nav-sub-btn active" href="index.html">Overview</a>' + navItems;
      var chList = document.getElementById('chapter-list');
      if (sl.chapters.length === 0) { chList.innerHTML = '<p class="empty-note">No chapters yet.</p>'; }
      else { chList.innerHTML = sl.chapters.map(function(ch,i){ return '<a class="chapter-link" href="'+ch.id+'.html"><span class="ch-num">Chapter '+(i+1)+'</span><span class="ch-title">'+ch.title+'</span><span>&rarr;</span></a>'; }).join(''); }
      try { var cr = await fetch('/generated/storylines/'+slId+'/index.html'); if(cr.ok) document.getElementById('overview-content').innerHTML = await cr.text(); else throw 0; }
      catch(e) { document.getElementById('overview-content').innerHTML = '<p class="empty-note">Add index.docx to content/storylines/'+slId+'/</p>'; }
    }
    init();
  </script>"""

