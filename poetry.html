<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Poetry — Astatyr</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <style>
    main { max-width: 720px; }

    /* ── STATUS STATES ── */
    .state {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      font-size: 0.85rem;
      color: var(--muted);
      padding: 2rem 0;
      animation: fadeUp 0.4s ease both;
    }

    .spinner {
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--ink);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-box {
      border: 1px solid #fdd;
      background: #fff8f8;
      border-radius: 10px;
      padding: 1.2rem 1.5rem;
      font-size: 0.83rem;
      color: #c0392b;
      animation: fadeUp 0.3s ease;
    }

    .error-box code {
      display: block;
      margin-top: 0.5rem;
      font-size: 0.75rem;
      color: #999;
      word-break: break-all;
    }

    /* ── POEMS ── */
    #poems-container {
      display: flex;
      flex-direction: column;
      gap: 0rem;
    }

    .poem {
      padding: 3rem 0;
      border-bottom: 1px solid var(--border);
      animation: fadeUp 0.5s ease both;
    }

    .poem:last-child { border-bottom: none; }

    .poem-number {
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #ccc;
      margin-bottom: 0.5rem;
    }

    .poem h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.6rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      color: var(--ink);
      margin-bottom: 0.4rem;
    }

    .poem-date {
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.8rem;
    }

    .poem-body {
      font-family: 'DM Serif Display', serif;
      font-style: italic;
      font-size: 1rem;
      line-height: 1.9;
      color: #333;
    }

    .stanza { margin-bottom: 1.4em; }
    .stanza:last-child { margin-bottom: 0; }
  </style>
</head>
<body>

  <nav id="site-nav"></nav>

  <main>
    <div class="page-header">
      <a class="back-link" href="/">← Back to Hub</a>
      <h1>Poetry</h1>
      <p>Feelings Unbounded. Drafts in progress.</p>
    </div>

    <!-- Loading state -->
    <div id="state-loading" class="state">
      <div class="spinner"></div>
      Fetching poems from Google Docs…
    </div>

    <!-- Error state (hidden by default) -->
    <div id="state-error" class="error-box" style="display:none">
      Couldn't load poems. Make sure the Apps Script URL is set and deployed correctly.
      <code id="error-detail"></code>
    </div>

    <!-- Poems render here -->
    <div id="poems-container" style="display:none"></div>
  </main>

  <script type="module" src="/assets/js/pages/poetry.js"></script>

</body>
</html>
