<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Poetry — Astatyr</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --white: #ffffff;
      --off-white: #f7f6f3;
      --ink: #1a1a1a;
      --muted: #888;
      --border: #e4e2dc;
      --nav-w: 220px;
      --hover-bg: #f0ede6;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--white);
      color: var(--ink);
      display: flex;
      min-height: 100vh;
    }

    /* ── SIDEBAR ── */
    nav {
      position: fixed;
      top: 0; left: 0;
      width: var(--nav-w);
      height: 100vh;
      background: var(--off-white);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 2.5rem 1.5rem;
      gap: 0.4rem;
      z-index: 100;
    }

    .nav-logo {
      font-family: 'DM Serif Display', serif;
      font-size: 1.4rem;
      letter-spacing: -0.02em;
      color: var(--ink);
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      line-height: 1.2;
      text-decoration: none;
      display: block;
    }

    .nav-logo span {
      display: block;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.72rem;
      font-weight: 300;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 0.3rem;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.55rem 0.8rem;
      border-radius: 8px;
      text-decoration: none;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 400;
      transition: background 0.18s ease, color 0.18s ease;
      cursor: pointer;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
    }

    .nav-btn .icon { font-size: 1rem; flex-shrink: 0; }
    .nav-btn:hover, .nav-btn.active { background: var(--hover-bg); color: var(--ink); }

    .nav-divider { height: 1px; background: var(--border); margin: 0.8rem 0; }

    .nav-section-label {
      font-size: 0.63rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #ccc;
      padding: 0.3rem 0.8rem;
      margin-top: 0.4rem;
    }

    .nav-footer {
      margin-top: auto;
      font-size: 0.7rem;
      color: var(--muted);
    }

    /* ── MAIN ── */
    main {
      margin-left: var(--nav-w);
      flex: 1;
      padding: 4rem 5rem;
      max-width: 720px;
    }

    .page-header {
      margin-bottom: 3.5rem;
      animation: fadeUp 0.4s ease both;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      color: var(--muted);
      text-decoration: none;
      margin-bottom: 1.5rem;
      transition: color 0.15s;
    }

    .back-link:hover { color: var(--ink); }

    .page-header h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 2.8rem;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 0.6rem;
    }

    .page-header p {
      font-size: 0.88rem;
      color: var(--muted);
      font-weight: 300;
    }

    /* ── STATUS STATES ── */
    .state {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      font-size: 0.85rem;
      color: var(--muted);
      padding: 2rem 0;
      animation: fadeUp 0.4s ease both;
    }

    .spinner {
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--ink);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-box {
      border: 1px solid #fdd;
      background: #fff8f8;
      border-radius: 10px;
      padding: 1.2rem 1.5rem;
      font-size: 0.83rem;
      color: #c0392b;
      animation: fadeUp 0.3s ease;
    }

    .error-box code {
      display: block;
      margin-top: 0.5rem;
      font-size: 0.75rem;
      color: #999;
      word-break: break-all;
    }

    /* ── POEMS ── */
    #poems-container {
      display: flex;
      flex-direction: column;
      gap: 0rem;
    }

    .poem {
      padding: 3rem 0;
      border-bottom: 1px solid var(--border);
      animation: fadeUp 0.5s ease both;
    }

    .poem:last-child { border-bottom: none; }

    .poem-number {
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #ccc;
      margin-bottom: 0.5rem;
    }

    .poem h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.6rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      color: var(--ink);
      margin-bottom: 0.4rem;
    }

    .poem-date {
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.8rem;
    }

    .poem-body {
      font-family: 'DM Serif Display', serif;
      font-style: italic;
      font-size: 1rem;
      line-height: 1.9;
      color: #333;
    }

    .stanza {
      margin-bottom: 1.4em;
    }

    .stanza:last-child { margin-bottom: 0; }

    /* Nav poem links */
    .nav-poem-btn {
      font-size: 0.77rem;
      padding-left: 1.8rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      nav { display: none; }
      main { margin-left: 0; padding: 2rem 1.5rem; }
      .page-header h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>

  <nav>
    <a class="nav-logo" href="index.html">
      Astatyr
      <span>Hub Page</span>
    </a>

    <a class="nav-btn" href="index.html#research"><span class="icon">🔍</span> Research</a>
    <a class="nav-btn" href="index.html#code"><span class="icon">🧑‍💻</span> Code Projects</a>
    <a class="nav-btn" href="index.html#engineering"><span class="icon">🧮</span> Engineering</a>
    <a class="nav-btn" href="index.html#writing"><span class="icon">✍️</span> Writing</a>

    <div class="nav-divider"></div>

    <div class="nav-section-label">Poems</div>
    <div id="nav-poems"></div>

    <div class="nav-divider"></div>

    <a class="nav-btn" href="index.html#contact"><span class="icon">📫</span> Contact</a>

    <div class="nav-footer">© 2025 Justin Adrian Halim</div>
  </nav>

  <main>
    <div class="page-header">
      <a class="back-link" href="index.html">← Back to Hub</a>
      <h1>Poetry</h1>
      <p>Feelings Unbounded. Drafts in progress.</p>
    </div>

    <!-- Loading state -->
    <div id="state-loading" class="state">
      <div class="spinner"></div>
      Fetching poems from Google Docs…
    </div>

    <!-- Error state (hidden by default) -->
    <div id="state-error" class="error-box" style="display:none">
      Couldn't load poems. Make sure the Apps Script URL is set and deployed correctly.
      <code id="error-detail"></code>
    </div>

    <!-- Poems render here -->
    <div id="poems-container" style="display:none"></div>
  </main>

  <script>
    // ── PASTE YOUR APPS SCRIPT WEB APP URL HERE ──────────────────
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzMYvRisnvBiKK3DeKPqZ-NPkb7F7vnJD4OJbPPfpKAqjR_rycPlJ2qrpE-QbfyjJBa/exec";
    // ─────────────────────────────────────────────────────────────

    const loading  = document.getElementById('state-loading');
    const errorBox = document.getElementById('state-error');
    const errorMsg = document.getElementById('error-detail');
    const container = document.getElementById('poems-container');
    const navPoems = document.getElementById('nav-poems');

    async function loadPoems() {
      if (!SCRIPT_URL || SCRIPT_URL === "YOUR_APPS_SCRIPT_URL_HERE") {
        showError("No Apps Script URL set. Open poetry.html and paste your URL into SCRIPT_URL.");
        return;
      }

      try {
        // Use no-cors isn't useful for reading data; Apps Script with Anyone access supports CORS
        const res = await fetch(SCRIPT_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        loading.style.display = 'none';

        if (!data.poems || data.poems.length === 0) {
          showError("No poems found. Check your Google Doc has named tabs.");
          return;
        }

        renderPoems(data.poems);
      } catch (err) {
        showError(err.message);
      }
    }

    function renderPoems(poems) {
      container.style.display = 'flex';

      poems.forEach((poem, i) => {
        // Sidebar link
        const navBtn = document.createElement('a');
        navBtn.className = 'nav-btn nav-poem-btn';
        navBtn.href = `#poem-${i}`;
        navBtn.textContent = poem.title;
        navPoems.appendChild(navBtn);

        // Poem block
        const el = document.createElement('article');
        el.className = 'poem';
        el.id = `poem-${i}`;
        el.style.animationDelay = `${i * 0.1}s`;

        // Split lines into stanzas (null = blank line = stanza break)
        const stanzas = [];
        let current = [];
        for (const line of poem.lines) {
          if (line === null) {
            if (current.length) { stanzas.push(current); current = []; }
          } else {
            current.push(line);
          }
        }
        if (current.length) stanzas.push(current);

        const stanzaHTML = stanzas
          .map(s => `<div class="stanza">${s.map(l => `<div>${l}</div>`).join('')}</div>`)
          .join('');

        el.innerHTML = `
          <div class="poem-number">— ${String(i + 1).padStart(2, '0')}</div>
          <h2>${poem.title}</h2>
          ${poem.date ? `<div class="poem-date">${poem.date}</div>` : ''}
          <div class="poem-body">${stanzaHTML}</div>
        `;

        container.appendChild(el);
      });

      // Scroll-based sidebar highlight
      const articles = document.querySelectorAll('.poem');
      const navBtns  = document.querySelectorAll('.nav-poem-btn');

      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            navBtns.forEach(b => b.classList.remove('active'));
            const idx = [...articles].indexOf(entry.target);
            if (navBtns[idx]) navBtns[idx].classList.add('active');
          }
        });
      }, { threshold: 0.5 });

      articles.forEach(a => observer.observe(a));
    }

    function showError(msg) {
      loading.style.display = 'none';
      errorBox.style.display = 'block';
      errorMsg.textContent = msg;
    }

    loadPoems();
  </script>

</body>
</html>
