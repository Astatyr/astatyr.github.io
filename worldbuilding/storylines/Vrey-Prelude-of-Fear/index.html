<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Storyline — Astatyr</title><!-- auto-updated by script -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --white: #ffffff; --off-white: #f7f6f3; --ink: #1a1a1a; --muted: #888; --border: #e4e2dc; --nav-w: 220px; --hover-bg: #f0ede6; }
    html { scroll-behavior: smooth; }
    body { font-family: 'DM Sans', sans-serif; background: var(--white); color: var(--ink); display: flex; min-height: 100vh; }
    nav { position: fixed; top: 0; left: 0; width: var(--nav-w); height: 100vh; background: var(--off-white); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 2.5rem 1.5rem; gap: 0.4rem; z-index: 100; overflow-y: auto; }
    .nav-logo { font-family: 'DM Serif Display', serif; font-size: 1.4rem; letter-spacing: -0.02em; color: var(--ink); margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); line-height: 1.2; text-decoration: none; display: block; }
    .nav-logo span { display: block; font-family: 'DM Sans', sans-serif; font-size: 0.72rem; font-weight: 300; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 0.3rem; }
    .nav-btn { display: flex; align-items: center; gap: 0.6rem; padding: 0.55rem 0.8rem; border-radius: 8px; text-decoration: none; color: var(--muted); font-size: 0.82rem; font-weight: 400; transition: background 0.18s, color 0.18s; border: none; background: transparent; width: 100%; text-align: left; }
    .nav-btn .icon { font-size: 1rem; }
    .nav-btn:hover, .nav-btn.active { background: var(--hover-bg); color: var(--ink); }
    .nav-divider { height: 1px; background: var(--border); margin: 0.8rem 0; }
    .nav-section-label { font-size: 0.63rem; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: #ccc; padding: 0.3rem 0.8rem; }
    .nav-sub-btn { font-size: 0.77rem; padding-left: 1.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nav-footer { margin-top: auto; font-size: 0.7rem; color: var(--muted); padding-top: 1rem; }

    main { margin-left: var(--nav-w); flex: 1; padding: 4rem 5rem; max-width: 820px; }
    .page-header { margin-bottom: 3rem; animation: fadeUp 0.4s ease both; }
    .back-link { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.75rem; color: var(--muted); text-decoration: none; margin-bottom: 1.5rem; transition: color 0.15s; }
    .back-link:hover { color: var(--ink); }
    .page-header h1 { font-family: 'DM Serif Display', serif; font-size: 2.6rem; letter-spacing: -0.03em; line-height: 1.1; margin-bottom: 0.5rem; }
    .page-header .meta { font-size: 0.75rem; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 0.8rem; }
    .page-header p { font-size: 0.9rem; color: var(--muted); font-weight: 300; line-height: 1.7; }

    .section-label { font-size: 0.68rem; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 1.2rem; display: flex; align-items: center; gap: 0.6rem; }
    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .wb-section { margin-bottom: 3.5rem; animation: fadeUp 0.5s ease both; }

    .doc-content h1, .doc-content h2 { font-family: 'DM Serif Display', serif; font-weight: 400; color: var(--ink); margin-bottom: 0.6rem; margin-top: 1.6rem; }
    .doc-content h1 { font-size: 1.5rem; } .doc-content h2 { font-size: 1.2rem; }
    .doc-content h3 { font-size: 1rem; font-weight: 500; color: var(--ink); margin-bottom: 0.4rem; margin-top: 1.2rem; }
    .doc-content p { font-size: 0.87rem; color: #444; line-height: 1.8; font-weight: 300; margin-bottom: 0.8rem; }
    .doc-content ul, .doc-content ol { padding-left: 1.4rem; margin-bottom: 0.8rem; }
    .doc-content li { font-size: 0.87rem; color: #444; line-height: 1.8; font-weight: 300; margin-bottom: 0.2rem; }
    .doc-content strong { font-weight: 500; color: var(--ink); }
    .doc-content em { font-style: italic; }
    .doc-content > *:first-child { margin-top: 0; }

    /* Chapter list */
    .chapter-list { display: flex; flex-direction: column; gap: 0.6rem; }
    .chapter-link { display: flex; align-items: center; padding: 1rem 1.2rem; border: 1px solid var(--border); border-radius: 10px; text-decoration: none; color: var(--ink); transition: box-shadow 0.2s, transform 0.2s; background: var(--white); gap: 1rem; }
    .chapter-link:hover { box-shadow: 0 3px 16px rgba(0,0,0,0.07); transform: translateY(-1px); }
    .chapter-link .ch-num { font-size: 0.65rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); min-width: 70px; flex-shrink: 0; }
    .chapter-link .ch-title { font-family: 'DM Serif Display', serif; font-size: 1rem; font-weight: 400; flex: 1; }
    .chapter-link .ch-arrow { color: var(--muted); }

    .loading { font-size: 0.82rem; color: var(--muted); font-style: italic; }
    .empty-note { font-size: 0.82rem; color: #ccc; font-style: italic; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 768px) { nav { display: none; } main { margin-left: 0; padding: 2rem 1.5rem; } }
  </style>
</head>
<body>

  <nav>
    <a class="nav-logo" href="/index.html">Astatyr<span>Hub Page</span></a>
    <a class="nav-btn" href="/worldbuilding.html"><span class="icon">🌍</span> Worldbuilding</a>
    <div class="nav-divider"></div>
    <div class="nav-section-label" id="nav-storyline-title">This Storyline</div>
    <a class="nav-btn nav-sub-btn active" href="index.html">Overview</a>
    <div id="nav-chapters"></div>
    <div class="nav-footer">© 2025 Justin Adrian Halim</div>
  </nav>

  <main>
    <div class="page-header">
      <a class="back-link" href="/worldbuilding.html">← Worldbuilding</a>
      <h1 id="page-title"><span class="loading">Loading…</span></h1>
      <div class="meta" id="page-meta"></div>
      <p id="page-desc"></p>
    </div>

    <section class="wb-section" id="overview">
      <div class="section-label">Overview</div>
      <div id="overview-content" class="doc-content">
        <p class="loading">Loading content…</p>
      </div>
    </section>

    <section class="wb-section" id="chapters">
      <div class="section-label">Chapters</div>
      <div id="chapter-list" class="chapter-list">
        <p class="loading">Loading chapters…</p>
      </div>
    </section>
  </main>

  <script>
    // Derive the storyline ID from the URL path
    // e.g. /worldbuilding/storylines/Vrey-Prelude-of-Fear/ → Vrey-Prelude-of-Fear
    const pathParts = window.location.pathname.replace(/\/$/, '').split('/');
    const STORYLINE_ID = pathParts[pathParts.length - 1];

    async function init() {
      // Load manifest
      let manifest;
      try {
        const res = await fetch('/generated/manifest.json');
        if (!res.ok) throw new Error();
        manifest = await res.json();
      } catch {
        document.getElementById('page-title').textContent = STORYLINE_ID;
        document.getElementById('overview-content').innerHTML =
          '<p class="empty-note">Manifest not found. Push your content and wait for the GitHub Action to run.</p>';
        document.getElementById('chapter-list').innerHTML = '';
        return;
      }

      // Find this storyline in the manifest
      const storyline = manifest.storylines.find(s => s.id === STORYLINE_ID);

      if (storyline) {
        // Update page header
        document.title = `${storyline.title} — Astatyr`;
        document.getElementById('page-title').textContent = storyline.title;
        document.getElementById('page-meta').textContent =
          [storyline.type, storyline.status].filter(Boolean).join(' · ');
        document.getElementById('page-desc').textContent = storyline.description || '';
        document.getElementById('nav-storyline-title').textContent = storyline.title;

        // Render chapter list
        const chapterList = document.getElementById('chapter-list');
        if (storyline.chapters && storyline.chapters.length > 0) {
          chapterList.innerHTML = storyline.chapters.map((ch, i) => `
            <a class="chapter-link" href="${ch.id}.html">
              <span class="ch-num">Chapter ${i + 1}</span>
              <span class="ch-title">${ch.title}</span>
              <span class="ch-arrow">→</span>
            </a>
          `).join('');

          // Populate sidebar chapter links
          document.getElementById('nav-chapters').innerHTML = storyline.chapters.map((ch, i) => `
            <a class="nav-btn nav-sub-btn" href="${ch.id}.html">Ch. ${i + 1} — ${ch.title}</a>
          `).join('');
        } else {
          chapterList.innerHTML = '<p class="empty-note">No chapters yet — add .docx files (not index.docx) to content/storylines/' + STORYLINE_ID + '/</p>';
        }
      } else {
        document.getElementById('page-title').textContent = STORYLINE_ID.replace(/[-_]/g, ' ');
        document.getElementById('chapter-list').innerHTML =
          '<p class="empty-note">Storyline not found in manifest. Make sure the folder name matches exactly.</p>';
      }

      // Load overview content
      try {
        const res = await fetch(`/generated/storylines/${STORYLINE_ID}/index.html`);
        if (!res.ok) throw new Error();
        document.getElementById('overview-content').innerHTML = await res.text();
      } catch {
        document.getElementById('overview-content').innerHTML =
          '<p class="empty-note">No overview yet — add content/storylines/' + STORYLINE_ID + '/index.docx to your repo.</p>';
      }
    }

    init();
  </script>
</body>
</html>
